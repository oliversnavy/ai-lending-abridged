[project]
name = "ai-lending-abridged"
version = "0.1.0"
description = "A deep-agent harness (LangGraph + deepagents): multi-agent orchestration, short/long-term memory, a three-critic lifecycle, and censoring-aware eval methodology, demonstrated on a public credit-risk-ranking task."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.72.0",
    "langchain>=1.2.0",
    "langchain-anthropic>=0.4.0",
    "langchain-openai>=1.3.3",
    "langsmith>=0.5.0",
    "deepagents>=0.6.12",
    "langgraph>=1.2.8",
    "lifelines>=0.30.0",
    "catboost>=1.2.10",
    "click>=8.4.2",
    "lightgbm>=4.6.0",
    "pandas>=3.0.3",
    "pyarrow>=24.0.0",
    "pycox>=0.3.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "torch>=2.13.0",
    "torchsurv>=0.2.0",
    "xgboost>=3.3.0",
]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cpu"

[dependency-groups]
dev = [
    "jupyterlab>=4.1.6",
    "nbformat>=5.10.4",
    "pytest>=8.0.0",
]
